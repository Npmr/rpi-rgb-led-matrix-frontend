{% extends "base.html" %}

{% block title %}Dateien Hochladen - Matrix Steuerung{% endblock %}

{% block content %}
<div class="upload-area">
    <h1 class="upload-area__title">Dateien Hochladen</h1>
    <p class="upload-area__description">
        Lade Bilder im .png, .jpg, .gif oder .webm Format hoch.
    </p>

    <div class="mb-lg">
        <span style="color:var(--color-text-secondary);">Festplattenbelegung: <strong>{{ freeDiskSpaceInPercent }}%</strong></span>
        <div class="progress mt-sm" style="max-width:300px;margin:0 auto;">
            <div class="progress__bar {% if freeDiskSpaceInPercent > 90 %}progress__bar--danger{% elif freeDiskSpaceInPercent > 75 %}progress__bar--warning{% endif %}" 
                 style="width: {{ freeDiskSpaceInPercent }}%"></div>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" action="/upload_image">
        <div class="field">
            <input class="field__input" type="file" name="image_file" multiple accept=".jpg, .jpeg, .png, .gif, .webm" style="padding:8px;">
        </div>
        <button class="btn btn--primary" type="submit">Hochladen</button>
    </form>
</div>
{% endblock %}
